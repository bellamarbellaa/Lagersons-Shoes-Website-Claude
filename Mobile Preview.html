<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Preview — Lagersons Shoes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#201A22;color:#fff;font-family:'Open Sans',sans-serif;padding:26px 20px 40px}
h1{font-family:'Playfair Display',serif;font-size:26px;margin:0 0 4px}
.sub{font-size:14px;color:#CFC4D1;margin:0 0 22px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px}
label{font-size:13px;color:#CFC4D1}
select,button{font-family:inherit;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid #FAD8E9;background:#fff;color:#0F172A;cursor:pointer}
.rail{display:flex;gap:24px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.phone{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
.phone .cap{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#F6C9DD}
.shell{background:#000;border-radius:38px;padding:11px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.screen{position:relative;background:#fff;border-radius:28px;overflow:hidden}
iframe{border:0;display:block;background:#fff}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:22px;background:#000;border-radius:999px;z-index:2;pointer-events:none}
</style>
</head>
<body>
<h1>Mobile Preview</h1>
<p class="sub">All four pages at phone width. Scroll inside a phone to test it, or drag the rail sideways.</p>
<div class="bar">
<label for="size">Device</label>
<select id="size">
<option value="390x844">iPhone 14 — 390 × 844</option>
<option value="360x800">Android — 360 × 800</option>
<option value="430x932">iPhone Pro Max — 430 × 932</option>
<option value="768x1024">iPad portrait — 768 × 1024</option>
</select>
<button id="reload">Reload all</button>
</div>
<div class="rail" id="rail"></div>
<script>
var pages=[['Home','index.html'],['Collection','koleksi.html'],['About Us','about.html'],['Contact','contact.html']];
var rail=document.getElementById('rail');
pages.forEach(function(p){
  var d=document.createElement('div');d.className='phone';
  d.innerHTML='<span class="cap">'+p[0]+'</span><div class="shell"><div class="screen"><span class="notch"></span><iframe src="'+p[1]+'" title="'+p[0]+'"></iframe></div></div>';
  rail.appendChild(d);
});
function apply(){
  var v=document.getElementById('size').value.split('x');
  document.querySelectorAll('iframe').forEach(function(f){f.style.width=v[0]+'px';f.style.height=v[1]+'px';});
  document.querySelectorAll('.notch').forEach(function(n){n.style.display=v[0]>600?'none':'block';});
}
document.getElementById('size').addEventListener('change',apply);
document.getElementById('reload').addEventListener('click',function(){document.querySelectorAll('iframe').forEach(function(f){f.src=f.src;});});
apply();
</script>
</body>
</html>
